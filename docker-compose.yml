version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    restart: unless-stopped
    network_mode: host  # <-- ДОБАВЛЕНО
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow_pass}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    volumes:
      - db_data:/var/lib/postgresql/data
    # ports и networks убраны
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      retries: 5

  api:
    build: ./server
    container_name: taskflow-api
    restart: unless-stopped
    network_mode: host  # <-- ДОБАВЛЕНО
    environment:
      DATABASE_URL: postgres://taskflow:taskflow_pass@127.0.0.1:5432/taskflow  # <-- db заменён на 127.0.0.1
      JWT_SECRET: ${JWT_SECRET:-super_secret_change_me}
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    # ports и networks убраны

  ui:
    build: ./client
    container_name: taskflow-ui
    restart: unless-stopped
    network_mode: host  # <-- ДОБАВЛЕНО
    environment:
      VITE_API_URL: http://127.0.0.1:5000/api  # <-- localhost заменён на 127.0.0.1
    depends_on: [api]
    # ports и networks убраны

volumes:
  db_data:
# networks убраны